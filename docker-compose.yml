# Build and run the Access Advisor stack locally.
#
#   docker compose build          # just the images
#   docker compose up -d          # build if needed, then run
#   docker compose up -d --build  # force a rebuild
#
# The browser talks only to the web service on :8080; nginx proxies /api to the
# api service over the compose network, which is the same single-origin
# arrangement the Vite dev server gives you locally.

name: access-advisor

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: access-advisor-api:latest
    # nginx.conf.template resolves BACKEND_ORIGIN by name, so the hostname the
    # web service dials has to match this one.
    hostname: access-advisor-api
    # Secrets and tuning come from .env (see the keys listed there). It is
    # gitignored, so copy it in before the first `up`.
    env_file:
      - .env
    environment:
      # The SPA is served from a different origin than the API only if you hit
      # :8000 directly; through nginx it is same-origin. Both are allowed here
      # so either entry point works in dev.
      CORS_ALLOW_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    restart: unless-stopped
    # HEALTHCHECK is baked into the image (readiness, not liveness — it waits
    # for the graph to compile and the MCP servers to be reached).

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty base URL keeps requests same-origin so SSE is never buffered by
        # a CORS preflight. Set it only if you serve the API on its own host.
        VITE_API_BASE_URL: ""
        VITE_API_PREFIX: /api/v1
        VITE_API_TIMEOUT_MS: "30000"
        VITE_STREAM_MODES: updates,messages,custom
    image: access-advisor-web:latest
    environment:
      BACKEND_ORIGIN: http://access-advisor-api:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
