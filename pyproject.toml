[project]
name = "fastapi-langgraph-mcp"
version = "1.0.0"
description = "FastAPI service streaming a LangGraph supervisor over three MCP-connected ReAct agents"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "langgraph>=1.0",
    "langgraph-supervisor>=0.0.29",
    "langgraph-checkpoint>=2.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=2.1",
    "langchain-mcp-adapters>=0.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]
postgres = ["langgraph-checkpoint-postgres>=2.0"]

# Alternative LLM_PROVIDER backends. Extra name == the provider's registered
# name, so the factory's "pip install -e '.[<provider>]'" hint is accurate.
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=0.2"]
openai_compatible = ["langchain-openai>=0.2"]
azure_openai = ["langchain-openai>=0.2"]
bedrock = ["langchain-aws>=0.2"]
ollama = ["langchain-ollama>=0.2"]
groq = ["langchain-groq>=0.2"]
mistral = ["langchain-mistralai>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
